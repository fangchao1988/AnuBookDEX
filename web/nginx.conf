# AnuBookDEX 前端 Nginx：SPA 路由 + 反向代理到引擎
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由（React Router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 合约程序文件（部署按钮 fetch 用）
    location /programs/ {
        try_files $uri =404;
    }

    # WebSocket 行情（升级协议）
    location /ws {
        proxy_pass http://engine:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── Anubis 引擎（与 Aleo 引擎并存）────────────────────────
    # 前端在 Anubis 链下使用 /anubis/* 前缀，此处去前缀后转给 Anubis 引擎：
    #   /anubis/order        → engine-anubis:9000/order
    #   /anubis/api/v1/xxx   → engine-anubis:9000/api/v1/xxx
    # ^~ 保证该前缀优先于下方正则 location（/api、/order）
    location ^~ /anubis/ws {
        proxy_pass http://engine-anubis:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location ^~ /anubis/ {
        proxy_pass http://engine-anubis:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # REST API / 下单 / 撤单 / 隐私下单（Aleo 引擎）
    location ~ ^/(api|order) {
        proxy_pass http://engine:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
