# AnuBookDEX 镜像构建推送 + 自动部署
#
# 触发：
#   - push tag v*   → 构建推送（版本 tag）并自动部署到服务器
#   - push main     → 构建推送 latest
#   - 手动触发（workflow_dispatch）
#
# 镜像目标：GHCR（ghcr.io/{repo}/engine、ghcr.io/{repo}/web）
#
# 服务器自动部署需要配置 Secrets：
#   SERVER_HOST     服务器 IP/域名
#   SERVER_USER     SSH 用户（如 root）
#   SERVER_SSH_KEY  SSH 私钥（部署用户）
#
# 密钥安全：构建不含任何链上密钥；服务器 .env.aleo 手动维护（CI 不接触）

name: Docker Build & Deploy

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          # GHCR 仓库名必须全小写（AnuBookDEX -> anubookdex）
          echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # ─── 引擎镜像（含 leo CLI，链上结算/撤单依赖） ───
      - name: Build & Push engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/engine/Dockerfile
          push: true
          # 海外 CI：官方 Go 模块源；leo 直接从 GitHub release 下载（LEO_URL 默认直连）
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/engine:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/engine:${{ steps.meta.outputs.tag }}

      # ─── Anubis 引擎镜像（EVM 结算，不含 leo CLI，体积更小） ───
      - name: Build & Push engine-anubis
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/engine-anubis/Dockerfile
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GIT_TAG=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/engine-anubis:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/engine-anubis:${{ steps.meta.outputs.tag }}

      # ─── 前端镜像（Nginx 托管 + 反向代理） ───
      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/web:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    # 仅打 tag（发布）时自动部署；main 分支只推镜像
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 服务器从 GHCR 拉镜像国内链路较慢（97MB 引擎镜像实测 ~10min），默认 10m 不够
          command_timeout: 30m
          script: |
            set -e
            cd /home/coffee_time/AnuBookDEX

            # git pull 必须成功：曾用 `|| echo 警告` 静默忽略失败，
            # 导致服务器 compose 停留在旧版本（缺 engine-anubis 服务），
            # 而 CI 仍显示成功，线上 502 却查不到原因。
            git pull --rebase

            grep -q "engine-anubis:" docker-compose.yml || {
              echo "❌ docker-compose.yml 缺少 engine-anubis 服务（文件是旧版本）"; exit 1; }
            test -f .env.anubis || {
              echo "❌ 缺少 .env.anubis，请先: cp .env.anubis.example .env.anubis 并填密钥"; exit 1; }

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # 真实验证：up -d 在容器崩溃时也返回 0，必须探测健康
            echo "→ 等待服务启动..."
            sleep 20
            docker compose ps
            fail=0
            for c in "Aleo 引擎:http://localhost:9000/health" \
                     "Anubis 引擎:http://localhost:9001/health" \
                     "前端代理:http://localhost:5005/anubis/api/v1/tokens"; do
              name="${c%%:*}"; url="${c#*:}"
              if curl -fsS --max-time 10 "$url" >/dev/null 2>&1; then echo "  ✅ $name";
              else echo "  ❌ $name ($url)"; fail=1; fi
            done
            if [ "$fail" = "1" ]; then
              echo "❌ 部署校验失败，最近日志："
              docker compose logs --tail=40 engine-anubis 2>/dev/null || true
              docker compose logs --tail=20 web 2>/dev/null || true
              exit 1
            fi
