# AnuBookDEX 双链 Docker Compose 部署
#
# 服务：
#   engine        - Aleo 撮合引擎（链上结算/撤单依赖 leo CLI，镜像内已含）
#   engine-anubis - Anubis 撮合引擎（EVM/ERC-20 金库结算，独立容器与端口）
#   web           - 前端 Nginx（SPA + 反向代理）
#                    /            → engine(aleo):9000
#                    /anubis/*    → engine-anubis:9000（去掉前缀）
#
# 快速开始：
#   1. cp .env.aleo.example .env.aleo   # 填入 ALEO_PRIVATE_KEY / ALEO_VIEW_KEY
#   2. cp conf/dev-aleo.yaml conf/config.yaml  # 或准备生产配置
#   3. docker compose up -d --build
#
# 访问：http://localhost:5005

services:
  engine:
    # CI 镜像模式：docker compose pull 直接拉 GHCR（服务器不本地构建，秒级更新）
    # 本地构建模式（可选）：取消 build 段注释后 docker compose up -d --build
    # build:
    #   context: .
    #   dockerfile: deploy/engine/Dockerfile
    image: ghcr.io/fangchao1988/anubookdex/engine:latest
    container_name: anubookdex-engine
    env_file: .env.aleo
    environment:
      - CONFIG_FILE=/app/conf/config.yaml
    volumes:
      # 测试配置模板（联调可切换 ./conf/dev-aleo.yaml）
      - ./conf/test-aleo.yaml:/app/conf/config.yaml:ro
      # 数据持久化（rocksdb 订单簿快照 + 行情快照 + 日志）
      - engine-data:/app/data
      - engine-logs:/app/logs
      - engine-sp:/app/sp-aleo-p3
    ports:
      # 直连引擎（可选，前端已通过 Nginx 代理）
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Anubis 撮合引擎（与 Aleo 引擎并存，独立端口与数据卷）──
  engine-anubis:
    image: ghcr.io/fangchao1988/anubookdex/engine-anubis:latest
    # 本地构建模式（可选）
    # build:
    #   context: .
    #   dockerfile: deploy/engine-anubis/Dockerfile
    container_name: anubookdex-engine-anubis
    env_file: .env.anubis
    environment:
      - CONFIG_FILE=/app/conf/config.yaml
    volumes:
      # Anubis 配置模板（密钥由 env_file 注入，配置里留空）
      - ./conf/test-anubis.yaml:/app/conf/config.yaml:ro
      - engine-anubis-data:/app/data
      - engine-anubis-logs:/app/logs
    ports:
      # 直连（前端已通过 Nginx /anubis/ 代理；此端口便于调试）
      - "9001:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    # CI 镜像模式：同上，本地构建可取消注释 build: ./web
    # build: ./web
    image: ghcr.io/fangchao1988/anubookdex/web:latest
    container_name: anubookdex-web
    ports:
      - "5005:80"
    depends_on:
      engine:
        condition: service_healthy
      # 只要求容器启动，不要求 healthy：
      # healthy 门槛会让 web 在 Anubis 引擎启动慢/异常时整体不可用，
      # 而 nginx 已用运行时 DNS 解析，Anubis 恢复后无需重启 web
      engine-anubis:
        condition: service_started
    restart: unless-stopped

volumes:
  engine-data:
  engine-logs:
  engine-sp:
  engine-anubis-data:
  engine-anubis-logs:
